name: provider-live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-e2e:
    runs-on: ubuntu-latest
    environment: flutterwave-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run live provider tests (requires secrets)
        env:
          FLW_SECRET_KEY: ${{ secrets.FLW_SECRET_KEY }}
          FLW_PUBLIC_KEY: ${{ secrets.FLW_PUBLIC_KEY }}
          FLW_WEBHOOK_SECRET: ${{ secrets.FLW_WEBHOOK_SECRET }}
        run: pnpm test:provider
